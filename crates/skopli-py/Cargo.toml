[package]
name = "skopli-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_skopli"
crate-type = ["cdylib"]

[dependencies]
skopli-core = { workspace = true }
skopli-wire = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pyo3 = { version = "0.29", default-features = false, features = [
  "extension-module",
  "abi3-py310",
  "macros",
] }
