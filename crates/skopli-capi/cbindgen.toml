language = "C"
header = "/* Generated by cbindgen from skopli-capi. DO NOT EDIT BY HAND. */"
include_guard = "SKOPLI_H"
pragma_once = true
autogen_warning = "/* This file is auto-generated; regenerate with the crate's build (SKOPLI_GEN_HEADER=1). */"
tab_width = 2
style = "type"
cpp_compat = true
documentation = true
documentation_style = "doxy"

[export]
prefix = ""

[export.rename]
"AgBuf" = "AgBuf"
"AgStatus" = "AgStatus"
"AgPricing" = "AgPricing"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false

[fn]
sort_by = "None"

[layout]
