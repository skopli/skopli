[package]
name = "skopli-capi"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
license.workspace = true
description = "C ABI for skopli: read, roll up, and price AI coding-agent session logs"

[lib]
name = "skopli"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
net = ["skopli-core/net"]

[dependencies]
skopli-core = { path = "../skopli-core", version = "0.0.0" }
skopli-wire = { path = "../skopli-wire", version = "0.0.0" }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
cbindgen = { workspace = true }
csbindgen = { workspace = true }

[dev-dependencies]
jiff = { workspace = true }
