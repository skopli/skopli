# Two event graphs share this file, because each registry's OIDC trusted publisher names it.
# A `v*` tag push or `workflow_dispatch` checks the manifest versions, builds and smoke-loads every
# artifact, and (unless it is a dry run) attaches them with SHA256SUMS to a draft GitHub release.
# A human publishing that draft (`release: published`) runs the registry publish jobs, which take
# the reviewed assets from the release and verify them against SHA256SUMS; crates.io publishes
# from the tag's source. Publish jobs run only when the repository variable PUBLISH_ENABLED is the
# string 'true' and the registry's trusted publisher is configured (PUBLISHING-SETUP.md); no
# registry secret is stored.
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts only; do not create/modify any release."
        type: boolean
        default: true

permissions:
  contents: read

# A release event's ref is the release tag, so the build run and the publish run of one tag
# queue behind each other here.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version-check:
    name: version-check
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Every manifest carries one version (and the tag's, on a tag)
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-versions.mjs "$TAG"

  napi-prebuild:
    name: napi-prebuild (${{ matrix.target }})
    needs: version-check
    if: github.event_name != 'release'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, smoke: true }
          - { runner: windows-latest, target: aarch64-pc-windows-msvc }
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: macos-latest, target: aarch64-apple-darwin, smoke: true }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, smoke: true }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, smoke: true }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools
      - name: napi build (release, per target)
        run: pnpm run build:native -- --target ${{ matrix.target }}
      - name: Smoke-load the addon
        if: matrix.smoke
        run: node -e "console.log(require('./native/index.cjs').supportedHarnesses().join(' '))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: napi-${{ matrix.target }}
          path: native/
          if-no-files-found: error

  # One npm package, skopli, carries the loader and every target's binary.
  npm-package:
    name: npm-package
    needs: napi-prebuild
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: napi-*
          merge-multiple: true
          path: native
      - name: Pack and smoke-load the tarball
        run: |
          pnpm pack
          mkdir "$RUNNER_TEMP/npm-smoke"
          tar -xzf skopli-*.tgz -C "$RUNNER_TEMP/npm-smoke"
          cd "$RUNNER_TEMP/npm-smoke/package"
          node --input-type=module -e '
            const { readUsage } = await import("./dist/index.js");
            const usage = await readUsage({ home: process.cwd(), env: {}, harnesses: ["claude"] });
            console.log(usage.events.length, "events");
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: skopli-*.tgz
          if-no-files-found: error

  # maturin abi3 wheels: manylinux, musllinux_1_2, windows, macOS per arch (not universal2), plus sdist.
  python-wheels:
    name: py-wheels (${{ matrix.platform }}-${{ matrix.target }})
    needs: version-check
    if: github.event_name != 'release'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              runner: ubuntu-latest,
              platform: manylinux,
              target: x86_64,
              manylinux: auto,
              smoke: true,
            }
          - { runner: ubuntu-latest, platform: manylinux, target: x86, manylinux: auto }
          - { runner: ubuntu-latest, platform: manylinux, target: aarch64, manylinux: auto }
          - { runner: ubuntu-latest, platform: manylinux, target: armv7, manylinux: auto }
          - { runner: ubuntu-latest, platform: manylinux, target: s390x, manylinux: auto }
          - { runner: ubuntu-latest, platform: manylinux, target: ppc64le, manylinux: auto }
          - { runner: ubuntu-latest, platform: musllinux, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest, platform: musllinux, target: x86, manylinux: musllinux_1_2 }
          - {
              runner: ubuntu-latest,
              platform: musllinux,
              target: aarch64,
              manylinux: musllinux_1_2,
            }
          - { runner: ubuntu-latest, platform: musllinux, target: armv7, manylinux: musllinux_1_2 }
          - { runner: windows-latest, platform: windows, target: x64, manylinux: auto, smoke: true }
          - { runner: windows-latest, platform: windows, target: x86, manylinux: auto }
          - { runner: windows-latest, platform: windows, target: aarch64, manylinux: auto }
          - { runner: macos-latest, platform: macos, target: x86_64, manylinux: auto }
          - { runner: macos-latest, platform: macos, target: aarch64, manylinux: auto, smoke: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build abi3 wheel (maturin)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --manifest-path crates/skopli-py/Cargo.toml --out dist-py
          sccache: "true"
      - name: Smoke-load the wheel
        if: matrix.smoke
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist-py skopli
          python -c "import skopli; print(skopli.default_cache_dir())"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.target }}
          path: dist-py
          if-no-files-found: error

  python-sdist:
    name: py-sdist
    needs: version-check
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist (maturin)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --manifest-path crates/skopli-py/Cargo.toml --out dist-py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist-py
          if-no-files-found: error

  capi-artifacts:
    name: capi (${{ matrix.target }})
    needs: version-check
    if: github.event_name != 'release'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, smoke: true }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, smoke: true }
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: macos-latest, target: aarch64-apple-darwin, smoke: true }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, smoke: true }
          - { runner: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.target }}
      - name: Build C ABI cdylib + staticlib
        run: cargo build -p skopli-capi --release --target ${{ matrix.target }}
      - name: Package one archive per target (header + libraries)
        shell: bash
        run: bash scripts/stage-capi.sh ${{ matrix.target }}
      - if: matrix.smoke
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Smoke-load the archived shared library
        if: matrix.smoke
        shell: bash
        run: |
          pkgid="$(cargo pkgid -p skopli-capi)"
          python - "${pkgid##*[@#]}" dist-capi/* <<'PY'
          import ctypes, pathlib, shutil, sys, tempfile
          version, archive = sys.argv[1:]
          out = pathlib.Path(tempfile.mkdtemp())
          shutil.unpack_archive(archive, out)
          names = {"libskopli.so", "libskopli.dylib", "skopli.dll"}
          lib = ctypes.CDLL(str(next(p for p in out.rglob("*") if p.name in names)))
          lib.ag_version.restype = ctypes.c_char_p
          found = lib.ag_version().decode()
          print(f"{archive}: ag_version {found}")
          sys.exit(0 if found == version else f"expected {version}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capi-${{ matrix.target }}
          path: dist-capi/*
          if-no-files-found: error

  ruby-gem:
    name: ruby-gem
    needs: version-check
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 branch (pinned)
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: crates/skopli-ruby
      - uses: ./.github/actions/rust
      - name: Build the gem
        working-directory: crates/skopli-ruby
        run: |
          bundle exec rake compile
          gem build skopli.gemspec -o skopli.gem
      # `gem install` compiles the extension from the gem's own files, as a user's install does.
      - name: Smoke-load the gem
        working-directory: ${{ runner.temp }}
        run: |
          gem install "$GITHUB_WORKSPACE/crates/skopli-ruby/skopli.gem"
          ruby -e 'require "skopli"; puts Skopli.default_cache_dir'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruby-gem
          path: crates/skopli-ruby/skopli.gem
          if-no-files-found: error

  dotnet-nupkg:
    name: dotnet-nupkg
    needs: version-check
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - name: Build C ABI cdylib
        run: cargo build -p skopli-capi --release
      - name: dotnet pack
        run: dotnet pack sdks/csharp/Skopli/Skopli.csproj -c Release -o dist-nuget
      # The package carries the managed assembly only; the native library comes from the C ABI build.
      - name: Smoke-load the package
        working-directory: ${{ runner.temp }}
        run: |
          nupkg=("$GITHUB_WORKSPACE"/dist-nuget/Skopli.*.nupkg)
          version="${nupkg[0]##*/Skopli.}"
          version="${version%.nupkg}"
          dotnet new console -o nupkg-smoke
          cd nupkg-smoke
          dotnet add package Skopli --version "$version" --source "$GITHUB_WORKSPACE/dist-nuget"
          echo 'var v = Skopli.SkopliClient.Version; System.Console.WriteLine(v); return v == args[0] ? 0 : 1;' > Program.cs
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release" dotnet run -- "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-nupkg
          path: dist-nuget/*.nupkg
          if-no-files-found: error

  java-jar:
    name: java-jar
    needs: version-check
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.0"
      - name: Build the jar (gradle)
        working-directory: sdks/java
        run: gradle --no-daemon jar sourcesJar
      - uses: ./.github/actions/rust
      - name: Build C ABI cdylib
        run: cargo build -p skopli-capi --release
      - name: Smoke-load the jar
        run: |
          echo 'class Smoke { public static void main(String[] a) { System.out.println(com.skopli.Skopli.version()); } }' > "$RUNNER_TEMP/Smoke.java"
          jar="$(find sdks/java/build/libs -name 'skopli-*.jar' ! -name '*-sources.jar')"
          java --enable-native-access=ALL-UNNAMED -Dskopli.library.path=target/release/libskopli.so \
            -cp "$jar" "$RUNNER_TEMP/Smoke.java"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-jar
          path: sdks/java/build/libs/*.jar
          if-no-files-found: error

  draft-release:
    name: draft-release
    needs:
      - npm-package
      - python-wheels
      - python-sdist
      - capi-artifacts
      - ruby-gem
      - dotnet-nupkg
      - java-jar
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    permissions:
      contents: write
    steps:
      - name: Refuse to change a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This endpoint returns published releases only, so a draft or no release at all is a 404.
          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .tag_name 2>&1); then
            echo "release $GITHUB_REF_NAME is already published, so its reviewed assets stay as they are" >&2
            exit 1
          elif [[ "$out" != *"(HTTP 404)"* ]]; then
            echo "$out" >&2
            exit 1
          fi
      - name: Download the release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{npm-package,wheels-*,capi-*,ruby-gem,dotnet-nupkg,java-jar}"
          path: release-artifacts
      - name: Collect the assets and write SHA256SUMS
        run: |
          mkdir assets
          for f in release-artifacts/*/*; do
            if [ -e "assets/${f##*/}" ]; then
              echo "two artifacts ship an asset named ${f##*/}" >&2
              exit 1
            fi
            cp "$f" assets/
          done
          cd assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create/refresh the DRAFT GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: assets/*

  # The publish jobs below run on `release: published` only and need nothing from the build graph.
  # On that event GITHUB_REF_NAME is the release's tag.
  publish-npm:
    name: publish-npm (GATED, OIDC)
    if: github.event_name == 'release' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify the reviewed tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "skopli-*.tgz" --pattern SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          if sha256sum skopli-*.tgz | grep -vxF -f SHA256SUMS; then echo "a downloaded file is not in SHA256SUMS" >&2; exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      # npm >= 11.5.1 exchanges the job's OIDC identity for a publish credential; the one-off
      # bootstrap publish of skopli is in PUBLISHING-SETUP.md.
      - name: npm 12.0.1 for OIDC trusted publishing
        run: npm install --global npm@12.0.1
      - name: npm publish (GATED, OIDC)
        run: |
          version="${GITHUB_REF_NAME#v}"
          dist_tag=()
          if [[ "$version" == *-* ]]; then dist_tag=(--tag next); fi
          if curl -fsS --retry 3 -o /dev/null "https://registry.npmjs.org/skopli/$version"; then
            echo "skopli $version is already on npm"
          else
            npm publish "skopli-$version.tgz" --provenance --access public "${dist_tag[@]}"
          fi

  publish-pypi:
    name: publish-pypi (GATED, OIDC)
    if: github.event_name == 'release' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify the reviewed wheels and sdist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist-py \
            --pattern "skopli-*.whl" --pattern "skopli-[0-9]*.tar.gz"
          cd dist-py
          sha256sum -c --ignore-missing ../SHA256SUMS
          if sha256sum -- * | grep -vxF -f ../SHA256SUMS; then echo "a downloaded file is not in SHA256SUMS" >&2; exit 1; fi
      - name: publish to PyPI (GATED, OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-py
          skip-existing: true

  publish-crates:
    name: publish-crates (GATED, OIDC)
    if: github.event_name == 'release' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - name: mint crates.io token (GATED, OIDC)
        id: cratesio
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      # Crates already on crates.io are skipped so a re-run finishes a partial publish.
      - name: cargo publish core, wire, capi (GATED)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio.outputs.token }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "skopli-core") | .version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match crate version $version" >&2
            exit 1
          fi
          for crate in skopli-core skopli-wire skopli-capi; do
            if curl -fsS --retry 3 -o /dev/null -A skopli-release "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish -p "$crate"
            fi
          done

  publish-rubygems:
    name: publish-rubygems (GATED, OIDC)
    if: github.event_name == 'release' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify the reviewed gem
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern skopli.gem --pattern SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          if sha256sum skopli.gem | grep -vxF -f SHA256SUMS; then echo "a downloaded file is not in SHA256SUMS" >&2; exit 1; fi
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 branch (pinned)
        with:
          ruby-version: "3.4"
      - name: configure RubyGems credentials (GATED, OIDC)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: gem push (GATED)
        run: |
          version="${GITHUB_REF_NAME#v}"
          # RubyGems stores a prerelease's "-" as ".pre." (0.2.0-rc.1 is 0.2.0.pre.rc.1).
          version="${version//-/.pre.}"
          if curl -fsS --retry 3 -o /dev/null "https://rubygems.org/api/v2/rubygems/skopli/versions/$version.json"; then
            echo "skopli $version is already on RubyGems"
          else
            gem push skopli.gem
          fi

  publish-nuget:
    name: publish-nuget (GATED, OIDC)
    if: github.event_name == 'release' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify the reviewed package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "Skopli.*.nupkg" --pattern SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          if sha256sum Skopli.*.nupkg | grep -vxF -f SHA256SUMS; then echo "a downloaded file is not in SHA256SUMS" >&2; exit 1; fi
      - name: NuGet login (GATED, OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: skopli
