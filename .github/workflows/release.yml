# Release - build ALL artifacts, upload to a DRAFT GitHub release, and (GATED)
# publish to registries (ticket 21; spec.md "Release-ready CI" 393-426).
#
# ============================ PUBLISHING IS GATED ============================
# Nothing here can publish until:
#   1. the repo variable  PUBLISH_ENABLED  is set to the string 'true', AND
#   2. each registry's OIDC trusted-publisher configuration exists and names
#      this owner/repo/workflow (see PUBLISHING-SETUP.md), AND
#   3. this workflow is triggered (push of a v* tag, or a manual workflow_dispatch).
# Every publish job carries `if: vars.PUBLISH_ENABLED == 'true'` and
# authenticates only via OIDC trusted publishing (id-token: write): no
# long-lived registry secret is stored. Without the registry-side publisher
# configuration the token exchange is rejected, so a stray run is a hard stop.
# The GitHub release is created as a DRAFT (never auto-published).
# ============================================================================
#
# Third-party actions are pinned to full commit SHAs. Least-privilege per job:
# the default is `contents: read`; the draft-release job takes
# `contents: write`; publish jobs take `id-token: write`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts only; do not create/modify any release."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # ARTIFACT BUILDS (no publishing; each uploads to the workflow artifact store)
  # ==========================================================================

  # --- Node napi prebuilds: napi-rs v3 matrix ------------------------------
  # Platform-package naming/scoping (optionalDependencies wiring, `napi
  # create-npm-dirs`) is deferred to ticket 08 (the name is not yet fixed); this
  # job builds the per-target .node prebuild the publish step would consume.
  napi-prebuild:
    name: napi-prebuild (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: windows-latest, target: aarch64-pc-windows-msvc }
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-latest, target: aarch64-unknown-linux-musl }
          - { runner: ubuntu-latest, target: armv7-unknown-linux-gnueabihf }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (pinned)
        with:
          toolchain: "1.89.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: pnpm install --frozen-lockfile
      - name: napi build (release, per target)
        run: pnpm run build:native -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: napi-${{ matrix.target }}
          path: native/*.node
          if-no-files-found: error

  # --- Python wheels: maturin abi3 wheels across the full platform matrix ----
  # Mirrors `maturin generate-ci github` (spec.md 410-413): manylinux
  # x64/x86/aarch64/armv7/s390x/ppc64le, musllinux_1_2 x64/x86/aarch64/armv7,
  # windows x64/x86/arm64, macOS x86_64 + aarch64 (NOT universal2), + sdist.
  python-wheels:
    name: py-wheels (${{ matrix.platform }}-${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux
          - { runner: ubuntu-latest, platform: manylinux, target: x86_64, manylinux: auto }
          - { runner: ubuntu-latest, platform: manylinux, target: x86, manylinux: auto }
          - { runner: ubuntu-latest, platform: manylinux, target: aarch64, manylinux: auto }
          - { runner: ubuntu-latest, platform: manylinux, target: armv7, manylinux: auto }
          - { runner: ubuntu-latest, platform: manylinux, target: s390x, manylinux: auto }
          - { runner: ubuntu-latest, platform: manylinux, target: ppc64le, manylinux: auto }
          # musllinux
          - { runner: ubuntu-latest, platform: musllinux, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest, platform: musllinux, target: x86, manylinux: musllinux_1_2 }
          - {
              runner: ubuntu-latest,
              platform: musllinux,
              target: aarch64,
              manylinux: musllinux_1_2,
            }
          - { runner: ubuntu-latest, platform: musllinux, target: armv7, manylinux: musllinux_1_2 }
          # windows
          - { runner: windows-latest, platform: windows, target: x64, manylinux: auto }
          - { runner: windows-latest, platform: windows, target: x86, manylinux: auto }
          - { runner: windows-latest, platform: windows, target: aarch64, manylinux: auto }
          # macOS (per-arch, not universal2)
          - { runner: macos-latest, platform: macos, target: x86_64, manylinux: auto }
          - { runner: macos-latest, platform: macos, target: aarch64, manylinux: auto }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build abi3 wheel (maturin)
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --manifest-path crates/skopli-py/Cargo.toml --out dist-py
          sccache: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.target }}
          path: dist-py
          if-no-files-found: error

  python-sdist:
    name: py-sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build sdist (maturin)
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: sdist
          args: --manifest-path crates/skopli-py/Cargo.toml --out dist-py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-sdist
          path: dist-py
          if-no-files-found: error

  # --- C ABI cdylibs/staticlibs per target ---------------------------------
  capi-artifacts:
    name: capi (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (pinned)
        with:
          toolchain: "1.89.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Build C ABI cdylib + staticlib
        run: cargo build -p skopli-capi --release --target ${{ matrix.target }}
      - name: Stage capi artifacts (+ header)
        shell: bash
        run: |
          mkdir -p capi-out
          cp crates/skopli-capi/include/skopli.h capi-out/
          for f in \
            "target/${{ matrix.target }}/release/libskopli.so" \
            "target/${{ matrix.target }}/release/libskopli.dylib" \
            "target/${{ matrix.target }}/release/libskopli.a" \
            "target/${{ matrix.target }}/release/skopli.dll" \
            "target/${{ matrix.target }}/release/skopli.dll.lib" \
            "target/${{ matrix.target }}/release/skopli.lib" ; do
            [ -f "$f" ] && cp "$f" capi-out/ || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capi-${{ matrix.target }}
          path: capi-out
          if-no-files-found: error

  # --- Ruby native gem -----------------------------------------------------
  ruby-gem:
    name: ruby-gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 branch (pinned)
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: crates/skopli-ruby
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (pinned)
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Build the gem
        working-directory: crates/skopli-ruby
        run: |
          bundle exec rake compile
          gem build skopli.gemspec -o skopli.gem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruby-gem
          path: crates/skopli-ruby/skopli.gem
          if-no-files-found: error

  # --- C#/.NET NuGet package -----------------------------------------------
  dotnet-nupkg:
    name: dotnet-nupkg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (pinned)
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Build C ABI cdylib
        run: cargo build -p skopli-capi --release
      - name: dotnet pack
        run: dotnet pack sdks/csharp/Skopli/Skopli.csproj -c Release -o dist-nuget
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-nupkg
          path: dist-nuget/*.nupkg
          if-no-files-found: error

  # --- Java JAR ------------------------------------------------------------
  java-jar:
    name: java-jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build the jar (gradle)
        working-directory: sdks/java
        run: gradle --no-daemon build -x test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-jar
          path: sdks/java/build/libs/*.jar
          if-no-files-found: error

  # ==========================================================================
  # DRAFT RELEASE (only job with contents: write) - never auto-published
  # ==========================================================================
  draft-release:
    name: draft-release
    needs:
      - napi-prebuild
      - python-wheels
      - python-sdist
      - capi-artifacts
      - ruby-gem
      - dotnet-nupkg
      - java-jar
    runs-on: ubuntu-latest
    # Only real thing this workflow writes: a DRAFT release. Skipped on a
    # dry-run dispatch.
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
      - name: Create/refresh the DRAFT GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true # never auto-published; a human publishes it
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/**/*

  # ==========================================================================
  # PUBLISH JOBS - ALL GATED on vars.PUBLISH_ENABLED == 'true' (repo variable,
  # absent here). All five registries authenticate via GitHub Actions OIDC
  # trusted publishing (id-token: write): no long-lived registry secret is
  # stored anywhere. Until the matching trusted-publisher configuration exists
  # on each registry (see PUBLISHING-SETUP.md), the token exchange is rejected
  # and the job hard-stops, so a stray run cannot publish.
  # ==========================================================================

  publish-npm:
    name: publish-npm (GATED, OIDC)
    needs: [draft-release, napi-prebuild]
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist-artifacts
      - run: pnpm install --frozen-lockfile
      # npm >= 11.5.1 exchanges the job's OIDC identity for a single-use
      # publish credential when the package has a trusted publisher naming
      # this repo + workflow. Requires the one-off local bootstrap publish
      # (PUBLISHING-SETUP.md "npm") for skopli and every skopli-<platform>
      # prebuild. napi prepublish wires the per-platform optionalDependencies
      # and publishes each prebuild package.
      - name: npm >= 11.5.1 for OIDC trusted publishing
        run: |
          npm --version
          npx --yes semver --range ">=11.5.1" "$(npm --version)" >/dev/null \
            || npm install -g npm@latest
      - name: napi prepublish + publish (GATED, OIDC)
        run: |
          pnpm exec napi prepublish -t npm
          npm publish --provenance --access public

  publish-pypi:
    name: publish-pypi (GATED, OIDC)
    needs: [draft-release, python-wheels, python-sdist]
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist-py
      # PyPI trusted publishing: the action exchanges the job's OIDC identity
      # for a single-use API token; requires the pending trusted publisher on
      # pypi.org (PUBLISHING-SETUP.md "PyPI"). No stored secret.
      - name: publish to PyPI (GATED, OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-py
          skip-existing: true

  publish-crates:
    name: publish-crates (GATED, OIDC)
    needs: [draft-release]
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (pinned)
        with:
          toolchain: "1.89.0"
      # crates.io trusted publishing: mints a 30-minute token from the job's
      # OIDC identity; requires the trusted publisher configured per crate on
      # crates.io (PUBLISHING-SETUP.md "crates.io"). No stored secret.
      - name: mint crates.io token (GATED, OIDC)
        id: cratesio
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: cargo publish (GATED)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio.outputs.token }}
        run: cargo publish -p skopli-core

  publish-rubygems:
    name: publish-rubygems (GATED, OIDC)
    needs: [draft-release, ruby-gem]
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 branch (pinned)
        with:
          ruby-version: "3.4"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ruby-gem
          path: gem-out
      # RubyGems trusted publishing: exchanges the job's OIDC identity for a
      # short-lived API key; requires the pending trusted publisher on
      # rubygems.org (PUBLISHING-SETUP.md "RubyGems"). No stored secret.
      - name: configure RubyGems credentials (GATED, OIDC)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: gem push (GATED)
        run: gem push gem-out/*.gem

  publish-nuget:
    name: publish-nuget (GATED, OIDC)
    needs: [draft-release, dotnet-nupkg]
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dotnet-nupkg
          path: nuget-out
      # NuGet trusted publishing: exchanges the job's OIDC identity for a
      # one-hour API key; requires the trusted publishing policy on nuget.org
      # for the `skopli` profile (PUBLISHING-SETUP.md "NuGet"). No stored
      # secret.
      - name: NuGet login (GATED, OIDC)
        id: nuget-login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        with:
          user: skopli
      - name: dotnet nuget push (GATED)
        run: |
          dotnet nuget push "nuget-out/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
