# Build every artifact, upload them to a draft GitHub release, and publish to the registries
# only when the repository variable PUBLISH_ENABLED is the string 'true' and the registry's
# OIDC trusted publisher names this workflow (PUBLISHING-SETUP.md). No registry secret is stored;
# without the trusted-publisher configuration the token exchange fails and the job stops.
# Third-party actions are pinned to full commit SHAs. The draft-release job alone takes
# `contents: write`; publish jobs take `id-token: write`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts only; do not create/modify any release."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  napi-prebuild:
    name: napi-prebuild (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: windows-latest, target: aarch64-pc-windows-msvc }
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/node
      - uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools
      - name: napi build (release, per target)
        run: pnpm run build:native -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: napi-${{ matrix.target }}
          path: native/*.node
          if-no-files-found: error

  # maturin abi3 wheels: manylinux, musllinux_1_2, windows, macOS per arch (not universal2), plus sdist.
  python-wheels:
    name: py-wheels (${{ matrix.platform }}-${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: manylinux, target: x86_64, manylinux: auto }
          - { runner: ubuntu-latest, platform: manylinux, target: x86, manylinux: auto }
          - { runner: ubuntu-latest, platform: manylinux, target: aarch64, manylinux: auto }
          - { runner: ubuntu-latest, platform: manylinux, target: armv7, manylinux: auto }
          - { runner: ubuntu-latest, platform: manylinux, target: s390x, manylinux: auto }
          - { runner: ubuntu-latest, platform: manylinux, target: ppc64le, manylinux: auto }
          - { runner: ubuntu-latest, platform: musllinux, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest, platform: musllinux, target: x86, manylinux: musllinux_1_2 }
          - {
              runner: ubuntu-latest,
              platform: musllinux,
              target: aarch64,
              manylinux: musllinux_1_2,
            }
          - { runner: ubuntu-latest, platform: musllinux, target: armv7, manylinux: musllinux_1_2 }
          - { runner: windows-latest, platform: windows, target: x64, manylinux: auto }
          - { runner: windows-latest, platform: windows, target: x86, manylinux: auto }
          - { runner: windows-latest, platform: windows, target: aarch64, manylinux: auto }
          - { runner: macos-latest, platform: macos, target: x86_64, manylinux: auto }
          - { runner: macos-latest, platform: macos, target: aarch64, manylinux: auto }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build abi3 wheel (maturin)
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --manifest-path crates/skopli-py/Cargo.toml --out dist-py
          sccache: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.target }}
          path: dist-py
          if-no-files-found: error

  python-sdist:
    name: py-sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build sdist (maturin)
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: sdist
          args: --manifest-path crates/skopli-py/Cargo.toml --out dist-py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-sdist
          path: dist-py
          if-no-files-found: error

  capi-artifacts:
    name: capi (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.target }}
      - name: Build C ABI cdylib + staticlib
        run: cargo build -p skopli-capi --release --target ${{ matrix.target }}
      - name: Package one archive per target (header + libraries)
        shell: bash
        run: bash scripts/stage-capi.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capi-${{ matrix.target }}
          path: dist-capi/*
          if-no-files-found: error

  ruby-gem:
    name: ruby-gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 branch (pinned)
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: crates/skopli-ruby
      - uses: ./.github/actions/rust
      - name: Build the gem
        working-directory: crates/skopli-ruby
        run: |
          bundle exec rake compile
          gem build skopli.gemspec -o skopli.gem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruby-gem
          path: crates/skopli-ruby/skopli.gem
          if-no-files-found: error

  dotnet-nupkg:
    name: dotnet-nupkg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust
      - name: Build C ABI cdylib
        run: cargo build -p skopli-capi --release
      - name: dotnet pack
        run: dotnet pack sdks/csharp/Skopli/Skopli.csproj -c Release -o dist-nuget
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-nupkg
          path: dist-nuget/*.nupkg
          if-no-files-found: error

  java-jar:
    name: java-jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.0"
      - name: Build the jar (gradle)
        working-directory: sdks/java
        run: gradle --no-daemon jar sourcesJar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-jar
          path: sdks/java/build/libs/*.jar
          if-no-files-found: error

  draft-release:
    name: draft-release
    needs:
      - napi-prebuild
      - python-wheels
      - python-sdist
      - capi-artifacts
      - ruby-gem
      - dotnet-nupkg
      - java-jar
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
      - name: Create/refresh the DRAFT GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/**/*

  publish-npm:
    name: publish-npm (GATED, OIDC)
    needs: [draft-release, napi-prebuild]
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/node
        with:
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist-artifacts
      # npm >= 11.5.1 exchanges the job's OIDC identity for a publish credential; the one-off
      # bootstrap publish of skopli and every skopli-<platform> package is in PUBLISHING-SETUP.md.
      - name: npm >= 11.5.1 for OIDC trusted publishing
        run: |
          npx --yes semver --range ">=11.5.1" "$(npm --version)" >/dev/null \
            || npm install -g npm@latest
      - name: napi prepublish + publish (GATED, OIDC)
        run: |
          pnpm exec napi prepublish -t npm
          npm publish --provenance --access public

  publish-pypi:
    name: publish-pypi (GATED, OIDC)
    needs: [draft-release, python-wheels, python-sdist]
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist-py
      - name: publish to PyPI (GATED, OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-py
          skip-existing: true

  publish-crates:
    name: publish-crates (GATED, OIDC)
    needs: [draft-release]
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust
      - name: mint crates.io token (GATED, OIDC)
        id: cratesio
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      # Crates already on crates.io are skipped so a re-run finishes a partial publish.
      - name: cargo publish core, wire, capi (GATED)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio.outputs.token }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "skopli-core") | .version')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match crate version $version" >&2
            exit 1
          fi
          for crate in skopli-core skopli-wire skopli-capi; do
            if curl -fsS --retry 3 -o /dev/null -A skopli-release "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish -p "$crate"
            fi
          done

  publish-rubygems:
    name: publish-rubygems (GATED, OIDC)
    needs: [draft-release, ruby-gem]
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 branch (pinned)
        with:
          ruby-version: "3.4"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ruby-gem
          path: gem-out
      - name: configure RubyGems credentials (GATED, OIDC)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: gem push (GATED)
        run: gem push gem-out/*.gem

  publish-nuget:
    name: publish-nuget (GATED, OIDC)
    needs: [draft-release, dotnet-nupkg]
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dotnet-nupkg
          path: nuget-out
      - name: NuGet login (GATED, OIDC)
        id: nuget-login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        with:
          user: skopli
      - name: dotnet nuget push (GATED)
        run: |
          dotnet nuget push "nuget-out/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
