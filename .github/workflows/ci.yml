# Build and test only; publishing lives in release.yml.
# Third-party actions are pinned to full commit SHAs.
# Rust matrix: 1.89.0 (pinned in rust-toolchain.toml), stable (drift canary), 1.88 (MSRV).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.89.0", "stable", "1.88"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      # The ruby crate (skopli) needs a host Ruby for rb-sys; the `ruby` job covers it.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude skopli --all-targets -- -D warnings
      - run: cargo test --workspace --exclude skopli

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust
      - uses: ./.github/actions/node
      - run: pnpm run build:native
      - run: pnpm run check

  web:
    name: web (site + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/node
      - run: pnpm --dir web/site run build
      - run: pnpm --dir web/docs run build

  node-addon:
    name: node-addon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/node
      - uses: ./.github/actions/rust
      - run: pnpm run build:native
      - run: pnpm exec tsc -p tsconfig.build.json

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust
      - uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: build
          args: --release --manifest-path crates/skopli-py/Cargo.toml
          sccache: "true"
      - shell: bash
        working-directory: crates/skopli-py
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links ../../target/wheels skopli
          pytest tests

  ruby:
    name: ruby (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 branch (pinned)
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: crates/skopli-ruby
      - uses: ./.github/actions/rust
      - working-directory: crates/skopli-ruby
        run: bundle exec rake

  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      # cgo's MinGW linker cannot consume the MSVC import library, so Windows links the GNU target.
      - uses: ./.github/actions/rust
        with:
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - if: runner.os != 'Windows'
        run: cargo build -p skopli-capi --release
      - if: runner.os == 'Windows'
        run: cargo build -p skopli-capi --release --target x86_64-pc-windows-gnu
      - shell: bash
        working-directory: sdks/go
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$GITHUB_WORKSPACE/target/x86_64-pc-windows-gnu/release:$PATH"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${DYLD_LIBRARY_PATH:-}"
          else
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          fi
          go build ./...
          go vet ./...
          go test ./...

  java:
    name: java (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: ./.github/actions/rust
      - run: cargo build -p skopli-capi --release
      - run: bash sdks/java/scripts/smoke.sh
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.0"
      - working-directory: sdks/java
        run: gradle --no-daemon jar sourcesJar

  dotnet:
    name: dotnet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust
      - run: cargo build -p skopli-capi --release
      - run: |
          dotnet build sdks/csharp/Skopli.sln -c Release
          dotnet test sdks/csharp/Skopli.sln -c Release --no-build

  swift:
    name: swift (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust
      - run: cargo build -p skopli-capi --release
      - working-directory: sdks/swift
        run: |
          export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${DYLD_LIBRARY_PATH:-}"
          swift build -Xlinker -L"$GITHUB_WORKSPACE/target/release" -Xlinker -lskopli
          swift test -Xlinker -L"$GITHUB_WORKSPACE/target/release" -Xlinker -lskopli
