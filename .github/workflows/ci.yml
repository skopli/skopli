# Build and test only; publishing lives in release.yml.
# Third-party actions are pinned to full commit SHAs.
# Rust matrix: 1.89.0 (pinned in rust-toolchain.toml), stable (drift canary), 1.88 (MSRV).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.89.0", "stable", "1.88"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      # The ruby crate (skopli) needs a host Ruby for rb-sys; the `ruby` job covers it.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude skopli --all-targets -- -D warnings
      - run: cargo test --workspace --exclude skopli

  # The verify-skopli-core crate is its own workspace, so the rust job never sees it.
  # Its detect and rollup tests run src/detect.ts and src/rollup.ts through Node 24.
  verify-core:
    name: verify-core
    runs-on: ubuntu-latest
    env:
      MANIFEST: .agents/skills/verify-skopli-core/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          components: rustfmt, clippy
          workspaces: .agents/skills/verify-skopli-core
      - uses: ./.github/actions/node
      - run: cargo fmt --all --manifest-path $MANIFEST -- --check
      - run: cargo clippy --manifest-path $MANIFEST --all-targets -- -D warnings
      - run: cargo test --release --manifest-path $MANIFEST

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - uses: ./.github/actions/node
      - run: pnpm run build:native
      - run: pnpm run check

  web:
    name: web (site + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - run: pnpm --dir web/site run build
      - run: pnpm --dir web/docs run build

  node-addon:
    name: node-addon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - uses: ./.github/actions/rust
      - run: pnpm run build:native
      - run: pnpm exec tsc -p tsconfig.build.json

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --manifest-path crates/skopli-py/Cargo.toml
          sccache: "true"
      - shell: bash
        working-directory: crates/skopli-py
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links ../../target/wheels skopli
          pytest tests

  ruby:
    name: ruby (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 branch (pinned)
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: crates/skopli-ruby
      - uses: ./.github/actions/rust
      - working-directory: crates/skopli-ruby
        run: bundle exec rake

  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false # sdks/go has no go.sum
      # cgo's MinGW linker cannot consume the MSVC import library, so Windows links the GNU target.
      - uses: ./.github/actions/rust
        with:
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - if: runner.os != 'Windows'
        run: cargo build -p skopli-capi --release
      - if: runner.os == 'Windows'
        run: cargo build -p skopli-capi --release --target x86_64-pc-windows-gnu
      - shell: bash
        working-directory: sdks/go
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$GITHUB_WORKSPACE/target/x86_64-pc-windows-gnu/release:$PATH"
          else
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          fi
          go build ./...
          go vet ./...
          go test ./...

  java:
    name: java (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: ./.github/actions/rust
      - run: cargo build -p skopli-capi --release
      - run: bash sdks/java/scripts/smoke.sh
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.0"
      - working-directory: sdks/java
        run: gradle --no-daemon jar sourcesJar

  dotnet:
    name: dotnet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - run: cargo build -p skopli-capi --release
      - run: |
          dotnet build sdks/csharp/Skopli.sln -c Release
          dotnet test sdks/csharp/Skopli.sln -c Release --no-build

  # GitHub caps concurrent macOS jobs per account (5 on the Free plan), so macOS runs each
  # language as a step of one of two jobs instead of a job per language. A failing language
  # step does not stop the others, and the job summary lists every step's result.
  macos-bindings:
    name: macos (node-addon, python, ruby)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 branch (pinned)
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: crates/skopli-ruby
      - uses: ./.github/actions/node
      - uses: ./.github/actions/rust
      - id: node-addon
        if: ${{ !cancelled() }}
        run: |
          pnpm run build:native
          pnpm exec tsc -p tsconfig.build.json
      - id: python-wheel
        if: ${{ !cancelled() }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --manifest-path crates/skopli-py/Cargo.toml
          sccache: "true"
      - id: python
        if: ${{ !cancelled() && steps.python-wheel.outcome == 'success' }}
        working-directory: crates/skopli-py
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links ../../target/wheels skopli
          pytest tests
      - id: ruby
        if: ${{ !cancelled() }}
        working-directory: crates/skopli-ruby
        run: bundle exec rake
      - name: Summarise results
        if: ${{ always() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          jq -r '"| Step | Result |", "|---|---|", (to_entries[] | "| \(.key) | \(.value.outcome) |")' <<< "$STEPS" |
            tee -a "$GITHUB_STEP_SUMMARY"

  macos-sdks:
    name: macos (go, java, dotnet, swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false # sdks/go has no go.sum
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.0"
      - uses: ./.github/actions/rust
      - id: skopli-capi
        run: cargo build -p skopli-capi --release
      - id: go
        if: ${{ !cancelled() && steps.skopli-capi.outcome == 'success' }}
        working-directory: sdks/go
        run: |
          export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${DYLD_LIBRARY_PATH:-}"
          go build ./...
          go vet ./...
          go test ./...
      - id: java
        if: ${{ !cancelled() && steps.skopli-capi.outcome == 'success' }}
        run: |
          bash sdks/java/scripts/smoke.sh
          cd sdks/java
          gradle --no-daemon jar sourcesJar
      - id: dotnet
        if: ${{ !cancelled() && steps.skopli-capi.outcome == 'success' }}
        run: |
          dotnet build sdks/csharp/Skopli.sln -c Release
          dotnet test sdks/csharp/Skopli.sln -c Release --no-build
      - id: swift
        if: ${{ !cancelled() && steps.skopli-capi.outcome == 'success' }}
        working-directory: sdks/swift
        run: |
          export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${DYLD_LIBRARY_PATH:-}"
          swift build -Xlinker -L"$GITHUB_WORKSPACE/target/release" -Xlinker -lskopli
          swift test -Xlinker -L"$GITHUB_WORKSPACE/target/release" -Xlinker -lskopli
      - name: Summarise results
        if: ${{ always() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          jq -r '"| Step | Result |", "|---|---|", (to_entries[] | "| \(.key) | \(.value.outcome) |")' <<< "$STEPS" |
            tee -a "$GITHUB_STEP_SUMMARY"

  # Aggregate check for branch protection: it must need every other job in this workflow.
  ci-ok:
    needs: [rust, verify-core, typescript, web, node-addon, python, ruby, go, java, dotnet, macos-bindings, macos-sdks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
