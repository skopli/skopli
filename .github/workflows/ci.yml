# CI - always-on PR/push gate (ticket 21; spec.md "Release-ready CI" 393-426).
#
# This workflow NEVER publishes anything: it only builds and tests. All publish
# steps live in release.yml and are gated. Third-party actions are pinned to full
# commit SHAs; each job takes minimal permissions (contents: read - the default
# below; no job here needs write).
#
# Toolchain matrix (spec.md 161-173): Rust 1.89.0 (primary), stable (drift
# canary), 1.88 (MSRV). The pinned channel lives in rust-toolchain.toml; the CI
# matrix overrides it per row via the toolchain action's `toolchain` input.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege by default for every job. No job in this file needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- Rust core: fmt / clippy / test across the toolchain matrix -------------
  rust:
    name: rust (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.89.0", "stable", "1.88"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (pinned)
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # The ruby crate (skopli) needs a host Ruby for rb-sys's build script;
      # it is verified in the `ruby` job below. Exclude it here so the core matrix
      # does not require Ruby (mirrors the build-report `--exclude skopli`).
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (workspace, excl. ruby)
        run: cargo clippy --workspace --exclude skopli --all-targets -- -D warnings
      - name: cargo test (workspace, excl. ruby)
        run: cargo test --workspace --exclude skopli

  # --- TypeScript: pnpm run check (oxlint + oxfmt --check + tsc + vitest) ------
  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (pinned)
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build native addon
        run: pnpm run build:native
      - name: pnpm run check
        run: pnpm run check

  # --- Websites: build + check both Astro apps (path-filtered) ----------------
  web:
    name: web (site + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: site check + build
        run: pnpm --dir web/site run check && pnpm --dir web/site run build
      - name: docs check + build
        run: pnpm --dir web/docs run check && pnpm --dir web/docs run build

  # --- C ABI: build cdylib/staticlib + assert the cbindgen header is zero-diff -
  capi-header:
    name: capi + header zero-diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (pinned)
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Build C ABI cdylib + staticlib
        run: cargo build -p skopli-capi --release
      - name: cbindgen header zero-diff check
        run: bash scripts/check-capi-header.sh
      - name: csbindgen C# bindings zero-diff check
        run: bash scripts/check-csharp-bindings.sh

  # --- Node prebuild smoke: build the napi addon on the OS matrix -------------
  node-addon:
    name: node-addon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (pinned)
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: pnpm install --frozen-lockfile
      - name: Build napi addon (release)
        run: pnpm run build:native
      - name: tsc build (dist)
        run: pnpm exec tsc -p tsconfig.build.json

  # --- Python wheel: build an abi3 wheel + import smoke on the OS matrix -------
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (pinned)
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Build abi3 wheel (maturin)
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: build
          args: --release --manifest-path crates/skopli-py/Cargo.toml
          sccache: "true"
      - name: Install the wheel + run pytest smoke
        shell: bash
        working-directory: crates/skopli-py
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links ../../target/wheels skopli
          pytest tests

  # --- Ruby native gem: rake compile + rake test (magnus/rb-sys) --------------
  ruby:
    name: ruby (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 branch (pinned)
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: crates/skopli-ruby
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (pinned)
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: rake compile + test (native gem)
        working-directory: crates/skopli-ruby
        run: bundle exec rake

  # --- Go SDK: build + test over the cgo C ABI (per-OS native cdylib) ---------
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (pinned)
        with:
          toolchain: "1.89.0"
      # On Windows, cgo's MinGW ld cannot link the MSVC import lib, so the capi
      # cdylib is built for the GNU target (ticket 17). Add that target on win.
      - name: Add windows-gnu target (windows only)
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Build C ABI cdylib (non-windows)
        if: runner.os != 'Windows'
        run: cargo build -p skopli-capi --release
      - name: Build C ABI cdylib (windows-gnu)
        if: runner.os == 'Windows'
        run: cargo build -p skopli-capi --release --target x86_64-pc-windows-gnu
      - name: go build + vet + test
        shell: bash
        working-directory: sdks/go
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$GITHUB_WORKSPACE/target/x86_64-pc-windows-gnu/release:$PATH"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${DYLD_LIBRARY_PATH:-}"
          else
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${LD_LIBRARY_PATH:-}"
          fi
          go build ./...
          go vet ./...
          go test ./...

  # --- Java SDK: FFM smoke + jextract bindings zero-diff (macos/linux) --------
  # jextract is not fetched on Windows here; the FFM smoke runs on ubuntu/macos.
  java:
    name: java (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (pinned)
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Build C ABI cdylib
        run: cargo build -p skopli-capi --release
      - name: FFM smoke (javac/java, no build tool)
        run: bash sdks/java/scripts/smoke.sh

  # --- C#/.NET SDK: dotnet build + test + csbindgen zero-diff -----------------
  dotnet:
    name: dotnet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (pinned)
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Build C ABI cdylib
        run: cargo build -p skopli-capi --release
      - name: dotnet build + test
        run: |
          dotnet build sdks/csharp/Skopli.sln -c Release
          dotnet test sdks/csharp/Skopli.sln -c Release --no-build

  # --- Swift SDK: build + test on macOS (its CI job IS the real verifier) -----
  swift:
    name: swift (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (pinned)
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Build C ABI cdylib/staticlib for the runner arch
        run: cargo build -p skopli-capi --release
      - name: swift build + test (linked against the capi cdylib)
        working-directory: sdks/swift
        run: |
          export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release:${DYLD_LIBRARY_PATH:-}"
          swift build -Xlinker -L"$GITHUB_WORKSPACE/target/release" -Xlinker -lskopli
          swift test -Xlinker -L"$GITHUB_WORKSPACE/target/release" -Xlinker -lskopli
