name: Node and pnpm
description: Install pnpm and Node 24 with the pnpm store cached, then install the workspace.
inputs:
  registry-url:
    description: npm registry URL to configure for publishing; empty for none.
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
    - run: pnpm install --frozen-lockfile
      shell: bash
