name: Rust toolchain
description: Install a pinned Rust toolchain and restore the cargo cache.
inputs:
  toolchain:
    description: Rust toolchain version to install.
    default: "1.89.0"
  components:
    description: Comma-separated rustup components (for example rustfmt, clippy).
    default: ""
  targets:
    description: Comma-separated extra compilation targets.
    default: ""
  workspaces:
    description: Cargo workspace roots to cache, one per line; the repository root when empty.
    default: ""
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch (pinned)
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: ${{ inputs.workspaces }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
