- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- insert:
    - id: llm-pi-ai
      name: "@deepseek-ai/dsh-llm-pi-ai"
      config:
        providers:
          llama:
            api: anthropic-messages
            baseURL: {origin}
            apiKeyEnv: LLAMA_API_KEY
            models:
              - id: qwen
                name: qwen
                contextWindow: 65536
                maxTokens: 4096
- id: agent-default-model
  config:
    provider: llama
    model: qwen
